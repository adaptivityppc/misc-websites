<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Snardy — Site Setup</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f7f5; color: #222; }
    main { width: min(92vw, 640px); padding: 4rem 2rem; text-align: center; }
    h1 { font-size: clamp(2.5rem, 7vw, 4rem); letter-spacing: -.06em; margin: 0 0 1rem; }
    p { line-height: 1.7; font-size: 1.05rem; color: #555; }
    small { display: block; margin-top: 3rem; color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>Snardy</h1>
    <p>This website is being prepared.</p>
    <small>snardy.com</small>
  </main>
</body>
</html>
